spring:
  profiles:
    active: dev
  application:
    name: back

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      hikaricp: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

auth-token:
  access-token:
    secret-key: ${JWT_SECRET_KEY:c2VjcmV0S2V5Rm9yVGVzdGluZ1B1cnBvc2VzT25seVdoZW5FbnZJc05vdFNldA==}
    expiration: 30m          # 서버에서 인식하는 액세스 토큰 자체의 유효기간
    cookie-max-age: 30m      # 브라우저가 액세스 토큰 쿠키를 유지하는 기간
  refresh-token:
    cookie-max-age: 30d      # 브라우저가 리프레시 토큰 쿠키를 유지하는 기간


