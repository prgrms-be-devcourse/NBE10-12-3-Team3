# buildUponDefaultConfig = true (build.gradle.kts) 이므로
# 이 파일에는 detekt 기본값과 다르게 적용하고 싶은 룰만 작성합니다.
#
# 예시)
# style:
#   MagicNumber:
#     active: false
#   MaxLineLength:
#     maxLineLength: 140

complexity:
  # ============================================================================
  # global/init/** (BaseInitData, ProdInitData, ProdInitDataService) 전용 예외.
  # 주의: jacoco의 **/init/** 제외(커버리지 무의미)와는 별개 판단이다. "커버리지가 필요 없다"는
  # "가독성 규칙이 안 맞는다"의 근거가 될 수 없으므로, 아래 3가지가 모두 성립할 때만 이 경로를 예외로 둔다.
  # 하나라도 성립하지 않는 패키지(global/dto, global/config, global/exception, global/base 등)로는
  # 이 예외를 넓히지 않는다.
  #
  #   1. 테스트가 이 코드를 실행하지 않는다: @Profile("dev")/@Profile("prod")이고 테스트는
  #      spring.profiles.active=test로 돈다. 즉 "읽기 좋게 쪼개라"를 강제해서 리팩토링해도
  #      그 결과를 검증해 줄 테스트가 없다 — 위 4개 패키지는 실제 요청 처리 경로에서 항상 실행되므로
  #      해당 없음.
  #   2. 아무도 이 파일들의 내부를 재사용하지 않는다: Spring이 기동 시 ApplicationRunner로 딱 1번
  #      실행하고 끝나는 스크립트라, 함수를 쪼개 응집도를 높여도 얻는 실익이 없다.
  #   3. 걸리는 위반이 실제 로직 복잡도가 아니라 "더미데이터 절차적 나열"에서만 나온다
  #      (유저 10명 만들고 시리즈 6개 만들고 포스트 만들고... 순서, 배열 인덱스용 매직넘버 등).
  #
  # 다른 패키지가 나중에 이 룰들을 위반하면, 그건 위 3가지를 다시 따져서 개별 판단할 신호이지
  # 이 예외를 자동으로 넓힐 근거가 아니다.
  # ============================================================================
  LongParameterList:
    excludes: ['**/init/**']
  LongMethod:
    excludes: ['**/init/**']
  CyclomaticComplexMethod:
    excludes: ['**/init/**']
  ComplexCondition:
    excludes: ['**/init/**']
  NestedBlockDepth:
    excludes: ['**/init/**']

style:
  MagicNumber:
    excludes: ['**/init/**']
  LoopWithTooManyJumpStatements:
    excludes: ['**/init/**']
  MaxLineLength:
    excludes: ['**/init/**']
