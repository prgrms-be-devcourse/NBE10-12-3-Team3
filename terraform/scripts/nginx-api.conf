# Nginx 리버스 프록시 설정 (api.scommit.store)
# Blue/Green 무중단 배포를 위한 업스트림 참조

# 업스트림: service-env.inc에서 동적으로 업데이트됨
upstream backend {
    include /etc/nginx/conf.d/service-env.inc;
}

# HTTP 요청 처리
server {
    listen 80;
    server_name api.scommit.store;

    # SSE 롱폴링: 버퍼링 비활성화, 타임아웃 30분
    location /api/notifications/subscribe {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;             # 즉시 전송 (SSE 필수)
        proxy_cache        off;             # 캐싱 비활성화
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
        proxy_read_timeout 1800s;           # 30분
    }

    # 일반 API: 최대 업로드 100MB
    location / {
        client_max_body_size 100M;
        proxy_pass           http://backend;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   120s;
    }
}
