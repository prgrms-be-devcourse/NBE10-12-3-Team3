name:  TripleS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./back

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: ./back

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Tests with Coverage
        run: ./gradlew check

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/build/reports/jacoco/test/html/

      - name: Generate Jacoco Report Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const htmlFile = './back/build/reports/jacoco/test/html/index.html';
            if (!fs.existsSync(htmlFile)) {
              console.log('Jacoco report not found');
              return;
            }

            const html = fs.readFileSync(htmlFile, 'utf-8');

            // 커밋 정보 가져오기
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            const commitMessage = commit.data.commit.message.split('\n')[0];

            // 전체 커버리지 추출
            const totalMatch = html.match(/<tfoot>.*?<tr>.*?<td>Total<\/td>.*?<td[^>]*>([^<]+) of ([^<]+)<\/td>.*?<td[^>]*>(\d+)%<\/td>.*?<td[^>]*>([^<]+) of ([^<]+)<\/td>.*?<td[^>]*>(\d+)%<\/td>/s);

            let overallReport = '';
            if (totalMatch) {
              const linesCovered = totalMatch[1].replace(/,/g, '');
              const linesTotal = totalMatch[2].replace(/,/g, '');
              const linesPercent = totalMatch[3];
              const branchesCovered = totalMatch[4].replace(/,/g, '');
              const branchesTotal = totalMatch[5].replace(/,/g, '');
              const branchesPercent = totalMatch[6];

              const linesStatus = linesPercent >= 80 ? '✅' : '⚠️';
              const branchesStatus = branchesPercent >= 70 ? '✅' : '⚠️';

              overallReport = `### ✅ 전체 커버리지 현황
| 메트릭 | 커버리지 | 라인 수 | 상태 | 목표 |
|--------|---------|--------|------|------|
| **라인** | ${linesPercent}% | ${linesCovered}/${linesTotal} | ${linesStatus} | 80% |
| **브랜치** | ${branchesPercent}% | ${branchesCovered}/${branchesTotal} | ${branchesStatus} | 70% |
`;
            }

            // 패키지별 커버리지 추출
            const rows = html.match(/<tbody>.*?<\/tbody>/s)?.[0].match(/<tr>.*?<\/tr>/g) || [];

            const packages = [];
            rows.forEach(row => {
              const packageMatch = row.match(/<td[^>]*><a[^>]*>([^<]+)<\/a>/);
              const lineMatch = row.match(/<td class="ctr2"[^>]*>(\d+)%<\/td>/);
              const branchMatch = row.match(/<td class="ctr2"[^>]*>(\d+)%<\/td>.*?<td class="ctr2"[^>]*>(\d+)%<\/td>/);

              if (packageMatch && lineMatch) {
                const pkg = packageMatch[1];
                const lineCov = parseInt(lineMatch[1]);
                const branchCov = branchMatch ? parseInt(branchMatch[2]) : 0;

                packages.push({
                  name: pkg.replace(/com\.scommit\.domain\./, '').replace(/\./g, '.'),
                  line: lineCov,
                  branch: branchCov
                });
              }
            });

            packages.sort((a, b) => b.line - a.line);

            let packageReport = '';
            if (packages.length > 0) {
              packageReport = `### 📦 패키지별 커버리지\n| 패키지 | 라인 | 브랜치 |\n|--------|------|--------|\n`;
              packages.forEach(pkg => {
                const lineStatus = pkg.line >= 80 ? '✅' : pkg.line >= 70 ? '⚠️' : '❌';
                const branchStatus = pkg.branch >= 70 ? '✅' : pkg.branch >= 60 ? '⚠️' : '❌';
                packageReport += `| ${pkg.name} | ${pkg.line}% ${lineStatus} | ${pkg.branch}% ${branchStatus} |\n`;
              });
            }

            const comment = `## 📊 Jacoco 커버리지 리포트
📌 **기준 커밋**: [\`${commitSha}\`](https://github.com/${{ github.repository }}/commit/${context.payload.pull_request.head.sha}) - ${commitMessage}

${overallReport}

${packageReport}

💬 [상세 리포트 보기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            // 기존 댓글 찾기
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const existingComment = comments.data.find(c => c.body.includes('📊 Jacoco 커버리지 리포트'));

            if (existingComment) {
              // 기존 댓글 업데이트
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              // 새 댓글 생성
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

