# 복구 인프라 자동 배포
# 프로덕션이 완전히 DOWN되었을 때만 실행
name: Terraform Infrastructure
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform 설정
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform 초기화
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        run: terraform init

      - name: Terraform 적용
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_root_password: ${{ secrets.DB_ROOT_PASSWORD }}
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
          TF_VAR_cloudinary_cloud_name: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          TF_VAR_cloudinary_api_key: ${{ secrets.CLOUDINARY_API_KEY }}
          TF_VAR_cloudinary_api_secret: ${{ secrets.CLOUDINARY_API_SECRET }}
          TF_VAR_mysql_exporter_password: ${{ secrets.MYSQL_EXPORTER_PASSWORD }}
        run: |
          terraform apply -auto-approve

      - name: 배포 요약 출력
        if: always()
        working-directory: terraform
        run: terraform output deployment_summary

      - name: 모니터링 서버 SSH 대기
        run: |
          for i in {1..20}; do
            if nc -z -w5 54.153.142.128 22; then
              echo "SSH ready"
              break
            fi
            echo "Waiting for SSH... ($i/20)"
            sleep 10
          done

      - name: 모니터링 설정 파일 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 54.153.142.128
          username: ubuntu
          key: ${{ secrets.MONITORING_SSH_KEY }}
          source: "terraform/scripts/docker-compose-monitoring.yml,terraform/scripts/prometheus.yml,terraform/scripts/loki-config.yml"
          target: /home/ubuntu/monitoring/
          strip_components: 2

      - name: 모니터링 스택 기동
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 54.153.142.128
          username: ubuntu
          key: ${{ secrets.MONITORING_SSH_KEY }}
          script: |
            cd /home/ubuntu/monitoring
            docker compose -f docker-compose-monitoring.yml up -d
